name: Checks

on:
  pull_request:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Links and heading anchors
        run: python3 scripts/check_links.py

      - name: Simulator question bank builds
        run: python3 simulator/build_questions.py
