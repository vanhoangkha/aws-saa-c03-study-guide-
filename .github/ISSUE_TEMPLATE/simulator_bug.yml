name: Simulator or site bug
description: Something on the exam simulator or study site does not work.
labels: ["bug"]
body:
  - type: input
    id: page
    attributes:
      label: Page
      placeholder: https://vanhoangkha.github.io/aws-saa-c03-study-guide-/simulator/
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 131, Windows 11
