name: Content error
description: Report a technical error, an outdated fact or a wrong answer key.
labels: ["content-error"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the report. Corrections are accepted when they are backed by AWS documentation, so please include a link.
  - type: input
    id: location
    attributes:
      label: Location
      description: File path and section heading, or the question number.
      placeholder: 04-Storage/README.md, "S3 Lifecycle" / 14-Practice Q12
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: What the guide says
      render: markdown
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should say
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: AWS documentation
      description: A docs.aws.amazon.com or aws.amazon.com page that confirms the correction.
      placeholder: https://docs.aws.amazon.com/...
    validations:
      required: true
